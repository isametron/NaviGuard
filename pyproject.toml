[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naviguard"
version = "0.3.0"
description = "AI-driven NavIC/GNSS satellite clock bias & ephemeris error intelligence"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tensorflow>=2.17",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
frontend = ["streamlit>=1.35", "requests>=2.31"]

[project.scripts]
naviguard = "naviguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:keras.*",
    "ignore::DeprecationWarning:joblib.*",
]

[tool.ruff]
line-length = 125
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E402", "E741", "B905", "B008", "UP045", "UP017"]   # E402: TF env var set before import; B008: FastAPI Depends idiom
